# Blur settings for rofi instances using the pywal theme.
# Include/merge this into your main picom config and restart picom.

backend = "glx";
blur-method = "dual_kawase";
blur-strength = 8;
blur-background = true;

# Exclude everything except our rofi class (adjust if your rofi WM_CLASS differs)
blur-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g != 'rofi-pywal'"
];

# Optional: ensure a bit of translucency (fine-tune)
# opacity-rule = [ "90:class_g = 'rofi-pywal'" ];
